# Brands that phishing commonly impersonates, and the domains they really use.
#
#   name      how the brand appears in reports
#   names     words that name the brand in a sender name or subject. Whole words,
#             any case; ALL-CAPS names of 5 letters or less (UPS, BIAT) must match in capitals.
#   domains   organizational domains the brand really sends from or links to
#   keywords  words that, found inside SOMEONE ELSE's domain, suggest the brand
#             (e.g. paypal-secure-login.com). Keep them distinctive: "post" or "bank" would
#             match thousands of unrelated sites.
#   whole_word true = keywords only count as a whole part of the domain (apple-id.com yes,
#             pineapple.com no). Needed for brands named with ordinary words.
#   verify    true = Fathia still has to confirm the domains are right
#
# Your own organization's domains go in PROTECTED_DOMAINS in .env, not here.

# ---------- Global ----------

[[brand]]
name = "Microsoft"
names = ["Microsoft", "Office 365", "Microsoft 365", "OneDrive", "SharePoint", "Microsoft Teams", "Outlook Team", "Hotmail"]
domains = ["microsoft.com", "office.com", "office365.com", "outlook.com", "live.com", "hotmail.com", "msn.com",
           "outlook.fr", "hotmail.fr", "live.fr", "hotmail.co.uk",
           "sharepoint.com", "microsoftonline.com", "onedrive.com", "microsoft365.com", "microsoftonline-p.com",
           "microsoftstore.com", "office.net", "windows.net", "azure.com"]
keywords = ["microsoft", "office365", "microsoft365", "onedrive", "sharepoint", "outlook", "hotmail", "microsoftonline"]

[[brand]]
name = "Google"
names = ["Google", "Gmail", "Google Drive", "Google Docs", "Google Workspace"]
