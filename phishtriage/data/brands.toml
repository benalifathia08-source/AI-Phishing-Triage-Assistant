           "googleusercontent.com", "gstatic.com", "googlesyndication.com", "googleadservices.com",
           "googletagmanager.com", "google-analytics.com", "googlevideo.com", "share.google", "g.co"]
keywords = ["google", "gmail", "googledrive", "googledocs"]

